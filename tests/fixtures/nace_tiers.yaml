# FIXTURE nace_tiers.yaml. Test data, not the owner's mapping.
#
# Small enough to reason about. Covers one sector for each tier so the tier
# tests and the precedence test have something to bite on.

meta:
  config_version: "fixture"
  last_updated: "2026-09-14"
  note: "Fixture file for tests. Not a source of truth."

producer_nace: ["24", "23.5", "20.15", "35.11"]
downstream_nace: ["25.11", "28.2"]

sectors:
  "24.10":
    label: "Manufacture of basic iron and steel"
    tier: 1
    confidence: high
    import_intensity: {}
    pass_through_share: {value: 0.5, source: "fixture", status: assumption}
    source: "fixture"
    status: assumption
  "23.51":
    label: "Manufacture of cement"
    tier: 1
    confidence: high
    # A producer sector that DOES carry an intensity, unlike 24.10 above. The
    # Tier 1 lost-allowance path needs production tonnes, and the input schema
    # has no production column, so the engine derives them from this intensity.
    # 24.10 deliberately has none, so tests can cover the missing-intensity path.
    import_intensity:
      cement:
        value: 250.0
        unit: "t per EUR million turnover"
        source: "fixture"
        status: assumption
