# cbam_rules.yaml
# Scope, thresholds, timeline and free-allocation phase-out for the EU CBAM.
#
# Every entry carries a source and a status. Status adopted means law in force.
# Status proposal means a Commission proposal that is not law and may never be.
# The UI, the docs and the code comments must repeat that distinction.
#
# IMPORTANT NOTE ON THE NAME "CBAM FACTOR"
# In Article 10a(1a) of Directive 2003/87/EC the CBAM factor is the share of
# free allocation that is RETAINED, not the share that is withdrawn. It is
# 97,5 percent in 2026 falling to nothing from 2034. It is easy to read it the
# other way round. This file therefore records both numbers on every year:
#   cbam_factor      the value as the Directive states it, that is free
#                    allocation retained
#   free_allocation  the same number as a fraction, which is what the cost
#                    engine multiplies by
# The engine only ever reads free_allocation.

meta:
  config_version: "1.0.0"
  last_updated: "2026-09-14"
  note: >-
    EUR-Lex refused automated requests on 2026-09-14. Every value below was read
    from a byte-identical mirror of the official PDF, named in the source field.
    The canonical EUR-Lex address is given alongside. See data/SOURCES.md.

# ---------------------------------------------------------------------------
# Rule branches
# ---------------------------------------------------------------------------
# The tool runs two branches side by side. The adopted branch is law today.
# The proposal branch applies both live Commission proposals together, because
# a bank stressing the policy path would not apply one without the other.

branches:
  adopted:
    label: "Adopted law"
    description: >-
      Regulation (EU) 2023/956 as amended by Regulation (EU) 2025/2083, and the
      free-allocation phase-out in Article 10a(1a) of Directive 2003/87/EC.
    free_allocation_schedule: adopted
    downstream_extension_applies: false
    status: adopted
    source: "Regulation (EU) 2023/956; Directive 2003/87/EC Article 10a(1a)"
  proposal:
    label: "Both Commission proposals applied"
    description: >-
      The slower free-allocation phase-out to 2038 proposed in COM(2026) 616 of
      17 July 2026, together with the downstream scope extension from 2028
      proposed in COM(2025) 989 of 17 December 2025. Neither is law.
    free_allocation_schedule: proposal_2038
    downstream_extension_applies: true
    status: proposal
    source: "COM(2026) 616 final; COM(2025) 989 final"

# ---------------------------------------------------------------------------
