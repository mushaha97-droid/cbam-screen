# emission_defaults.yaml
#
# Default embedded emission values in tCO2e per tonne of good.
#
# GENERATED by tools/extract_default_values.py from the Commission
# default-values workbook. Do not edit by hand. To change a value, change
# the source file or the generator, then rerun it.
#
# Two blocks:
#   good_groups  one entry per group the engine prices, keyed to the
#                import_t_* columns of template_borrowers.csv. Each names a
#                representative CN code and copies that code's adopted value.
#   by_cn        every CN code row on the fallback sheet, exactly as
#                published. This is the audit trail behind good_groups.
#
# Sign conventions: indirect null means the table gives no indirect value
# for that code, which for iron and steel, aluminium and hydrogen reflects
# that indirect emissions are not covered for those goods.

