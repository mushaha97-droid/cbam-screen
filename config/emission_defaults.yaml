  source_regulation: "Annex I to Commission Implementing Regulation (EU) 2025/2621, as corrected by Commission Implementing Regulation (EU) 2026/1740. Applies from 1 January 2026."
  workbook_version: "Version 2, dated 2026-08-06 per the workbook Version History sheet, based on Annexes I and II to Implementing Regulation (EU) 2026/1740 adopted 20 July 2026. Note the cached filename carries the version 1 date of 2026-02-04. The content is version 2."
  basis: "The fallback sheet, that is the values that apply when origin specific values are not used. Origin specific sheets exist per exporting country and are not used by this tool."
  decimal_note: "The workbook writes decimals with European commas. Converted to points. Cells reading N/A, - or see below carry no value and become null."
  caveat: "The workbook Overview disclaimer, written for version 1, says the file excludes indirect default values. The version 2 history entry says the file is based on Annexes I and II, and the sheet does carry indirect values for cement and fertilisers. The indirect values below are recorded as found. Verify against the Official Journal text before any use beyond screening."

data_quality_scale:
  5: "Adopted value copied for the exact CN code the borrower imports."
  4: "Adopted value for the parent CN heading of the code the borrower imports."
  3: "Adopted value of a representative CN code chosen by the author to stand for a whole sector group. Correct for that code, approximate for the group."
  2: "Value derived or scaled by the author from an adopted value."
  1: "No adopted value available. See the TODO on the entry."

