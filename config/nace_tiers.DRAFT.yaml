# nace_tiers.DRAFT.yaml
#
# A starting point for config/nace_tiers.yaml, which CLAUDE.md says the owner
# writes by hand. Nothing reads this file. The engine reads config/nace_tiers.yaml
# and the tests read tests/fixtures/nace_tiers.yaml, so this draft can be edited
# freely without breaking anything.
#
# HOW TO USE IT
#   1. Read the comments on each block and change what you disagree with.
#   2. Replace every "TODO-owner" with a real number and a real source.
#   3. Copy the result over config/nace_tiers.yaml.
#
# WHAT IS DEFENSIBLE HERE AND WHAT IS NOT
#   The tier assignments below follow the tier definitions in CLAUDE.md section 6
#   and the producer NACE list it gives. Those are defensible as written.
#   Every import intensity and every pass-through share is marked TODO-owner.
#   They need Eurostat Comext (source 8) and CBS StatLine input-output tables
#   (source 9), which are the owner's inputs. No placeholder number in this file
#   should ever be shipped.
#
# TIER DEFINITIONS, restated from CLAUDE.md section 6
#   Tier 1  NACE in the producer list. Makes a CBAM good in the EU, so loses
#           free allocation as the phase-out runs.
#   Tier 2  Imports a CBAM good from a non-exempt, non-EU origin. This is a
#           property of the borrower row, not of its NACE code, so no sector is
#           mapped to Tier 2 here.
#   Tier 3  In the downstream-extension list and no direct import. Proposal only.
#   Tier 4  Material CBAM-good input share and no direct import.
#   Tier 0  None of the above.
#
# CONFIDENCE
#   high    the tier follows directly from the CLAUDE.md definitions or from the
#           text of an adopted regulation
#   medium  a reasonable reading, but the sector is mixed and some borrowers in
#           it will sit in a different tier
#   low     a placeholder judgement that needs the owner's data to stand up

meta:
  config_version: "0.1.0-draft"
  last_updated: "2026-09-14"
  note: >-
    Draft for the owner. Not loaded by the engine. Import intensities and
    pass-through shares are placeholders marked TODO-owner.

# Tier 1 producer prefixes, from CLAUDE.md section 6.
#
# JUDGEMENT CALL on "hydrogen": CLAUDE.md lists "hydrogen" in the producer list,
# but hydrogen is not a NACE code. Hydrogen production sits in NACE 20.11,
# manufacture of industrial gases, which also covers oxygen, nitrogen and carbon
# dioxide. Using 20.11 therefore sweeps in producers that make no hydrogen at
# all. Owner decision needed: keep 20.11 and accept the over-capture, or drop it
# and identify hydrogen producers from the import and production columns instead.
producer_nace:
  - "24"      # Manufacture of basic metals. Covers iron, steel and aluminium.
  - "23.5"    # Manufacture of cement, lime and plaster.
  - "20.15"   # Manufacture of fertilisers and nitrogen compounds.
  - "35.11"   # Production of electricity.
  - "20.11"   # Manufacture of industrial gases. Stands in for hydrogen. See above.

# Tier 3 downstream prefixes, for the December 2025 extension proposal.
#
# STATUS: proposal, and the product list is not yet confirmed from the proposal
# document. The entries below are the NACE divisions where steel and aluminium
# intensive downstream products are made. They are a placeholder shape, not a
# reading of the proposal text. Replace them once the proposal's product annex
# is available. See the TODO in data/SOURCES.md.
downstream_nace:
  - "25"      # Fabricated metal products, except machinery and equipment.
  - "27"      # Electrical equipment.
  - "28"      # Machinery and equipment not elsewhere classified.
  - "29"      # Motor vehicles, trailers and semi-trailers.
  - "30"      # Other transport equipment.

